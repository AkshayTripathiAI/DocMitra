name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Tests + extraction eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-demo.txt
      # The demo requirements skip EasyOCR/PyTorch; tests fake OCR and the text-tier eval doesn't need it.
      - run: pip install -r requirements-demo.txt pytest httpx
      - run: pytest -q
      - name: Extraction eval (fails below evals/thresholds.json)
        run: python -m evals.run_extraction --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: backend/evals/reports/

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
